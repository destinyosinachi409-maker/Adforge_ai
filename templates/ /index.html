<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdForge AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#fff;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
h1{text-align:center;font-size:2rem;margin-bottom:10px;background:linear-gradient(90deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p.subtitle{text-align:center;color:#94a3b8;margin-bottom:30px}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:30px}
.tab{padding:12px 24px;border-radius:12px;border:2px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-weight:600;transition:.3s}
.tab.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent}
.form{background:#1e293b;border-radius:16px;padding:24px;border:1px solid #334155}
.form-group{margin-bottom:20px}
label{display:block;margin-bottom:8px;font-weight:600;font-size:.875rem;color:#cbd5e1}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:2px solid #334155;background:#0f172a;color:#fff;font-size:1rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:#667eea}
textarea{min-height:100px;resize:vertical}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;transition:.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(102,126,234,.3)}
.preview{background:#0f172a;border-radius:16px;min-height:300px;display:flex;align-items:center;justify-content:center;border:2px dashed #334155;margin-top:20px;position:relative}
.preview img{max-width:100%;border-radius:12px}
.preview-text{background:#1e293b;padding:20px;border-radius:12px;white-space:pre-wrap;width:100%;margin:20px}
.loading{display:none;text-align:center;padding:40px}
.loading.active{display:block}
.spinner{width:50px;height:50px;border:4px solid #334155;border-top-color:#667eea;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;padding:16px 24px;border-radius:12px;background:#1e293b;border:1px solid #334155;transform:translateY(100px);opacity:0;transition:.3s;z-index:1000}
.toast.show{transform:translateY(0);opacity:1}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>🔥 AdForge AI</h1>
<p class="subtitle">Free AI Ad Generator - No signup needed</p>

<div class="tabs">
<button class="tab active" onclick="switchTab('image')">📷 Image</button>
<button class="tab" onclick="switchTab('copy')">✍️ Copy</button>
</div>

<div id="image-form" class="form">
<div class="form-group">
<label>What do you want to advertise?</label>
<<textarea id="img-prompt" placeholder="e.g. Premium wireless headphones, sleek black design"></textarea>
</div>
<div class="form-group">
<label>Style</label>
<select id="img-style">
<option value="modern">Modern</option>
<option value="vintage">Vintage</option>
<option value="cinematic">Cinematic</option>
<option value="playful">Playful</option>
<option value="luxury">Luxury</option>
<option value="corporate">Corporate</option>
</select>
</div>
<button class="btn" onclick="generateImage()">✨ Generate Image</button>
</div>

<div id="copy-form" class="form hidden">
<div class="form-group">
<label>Product Name</label>
<input type="text" id="copy-product" placeholder="e.g. SmartFit Pro">
</div>
<div class="form-group">
<label>Target Audience</label>
<input type="text" id="copy-audience" placeholder="e.g. Fitness enthusiasts">
</div>
<div class="form-group">
<label>Tone</label>
<select id="copy-tone">
<option value="professional">Professional</option>
<option value="casual">Casual</option>
<option value="exciting">Exciting</option>
<option value="luxury">Luxury</option>
<option value="humorous">Humorous</option>
<option value="urgent">Urgent</option>
</select>
</div>
<button class="btn" onclick="generateCopy()">✨ Generate Copy</button>
</div>

<div class="preview" id="preview">
<div id="placeholder" style="text-align:center;color:#64748b">
<div style="font-size:3rem;margin-bottom:10px">🎨</div>
<p>Your ad will appear here</p>
</div>
<div class="loading" id="loading">
<div class="spinner"></div>
<p style="color:#94a3b8">Generating...</p>
</div>
<div id="result"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
function switchTab(tab){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
event.target.classList.add('active');
document.getElementById('image-form').classList.toggle('hidden', tab!=='image');
document.getElementById('copy-form').classList.toggle('hidden', tab!=='copy');
document.getElementById('result').innerHTML='';
document.getElementById('placeholder').style.display='block';
}

function showLoading(){
document.getElementById('placeholder').style.display='none';
document.getElementById('result').innerHTML='';
document.getElementById('loading').classList.add('active');
}

function hideLoading(){
document.getElementById('loading').classList.remove('active');
}

function showToast(msg){
const t=document.getElementById('toast');
t.textContent=msg;
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),3000);
}

async function generateImage(){
const prompt=document.getElementById('img-prompt').value;
if(!prompt){showToast('Enter a description');return;}
showLoading();
try{
const r=await fetch('/api/generate/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,style:document.getElementById('img-style').value})});
const d=await r.json();
hideLoading();
if(d.success){
document.getElementById('result').innerHTML=`<img src="${d.url}" alt="Generated Ad" style="max-width:100%;border-radius:12px">`;
showToast('Image generated!');
}else{showToast(d.error||'Failed');}
}catch(e){hideLoading();showToast('Error, try again');}
}

async function generateCopy(){
const product=document.getElementById('copy-product').value;
const audience=document.getElementById('copy-audience').value;
if(!product||!audience){showToast('Fill all fields');return;}
showLoading();
try{
const r=await fetch('/api/generate/copy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_name:product,target_audience:audience,tone:document.getElementById('copy-tone').value})});
const d=await r.json();
hideLoading();
if(d.success){
document.getElementById('result').innerHTML=`<div class="preview-text">${d.copy.replace(/\n/g,'<<br>')}</div>`;
showToast('Copy generated!');
}else{showToast(d.error||'Failed');}
}catch(e){hideLoading();showToast('Error, try again');}
}
</script>
</body>
</html>
